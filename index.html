<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema NFC Pet</title>
  <style>
    :root {
      --primary: #2563eb;
      --success: #22c55e;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --subtext: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px 15px; display: flex; justify-content: center; }

    /* LAYOUT BASE */
    .container { width: 100%; max-width: 600px; }
    .card { background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); overflow: hidden; border: 1px solid #e2e8f0; margin-bottom: 25px; }

    /* CARTÃO DO PET (VISUALIZADO VIA NFC) */
    .pet-header { background: var(--primary); color: white; padding: 30px 20px 60px; text-align: center; }
    .pet-avatar { width: 120px; height: 120px; border-radius: 50%; border: 4px solid white; margin: -60px auto 10px; display: block; object-fit: cover; background: #eee; }
    .pet-body { padding: 20px; text-align: center; }
    .pet-title { font-size: 1.8rem; font-weight: 700; color: var(--text); }
    .pet-breed { color: var(--subtext); font-size: 1rem; margin-bottom: 20px; }
    
    .info-box { background: #f1f5f9; border-radius: 12px; padding: 15px; text-align: left; margin-bottom: 20px; font-size: 0.95rem; line-height: 1.6; }
    .info-box strong { color: var(--text); }

    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; font-weight: 600; text-decoration: none; font-size: 1rem; color: white; border: none; cursor: pointer; transition: opacity 0.2s; }
    .btn:active { opacity: 0.85; }
    .btn-wsp { background: var(--success); }
    .btn-tel { background: #0284c7; }
    .btn-gps { background: #ea580c; }
    .btn-copy { background: #475569; font-size: 0.85rem; padding: 8px 12px; margin-bottom: 0; }

    /* PAINEL DE ADMIN */
    .admin-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 15px; color: var(--text); display: flex; align-items: center; justify-content: space-between; }
    .form-group { margin-bottom: 12px; text-align: left; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: var(--subtext); }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; }
    .form-group input:focus { border-color: var(--primary); }
    
    .pet-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 10px; }
    .pet-item img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
    .pet-item-info { flex: 1; margin-left: 12px; text-align: left; }
    .pet-item-info strong { display: block; font-size: 1rem; }
    .pet-item-info span { font-size: 0.8rem; color: var(--subtext); }

    pre { background: #0f172a; color: #38bdf8; padding: 15px; border-radius: 10px; overflow-x: auto; font-size: 0.85rem; text-align: left; margin-top: 10px; white-space: pre-wrap; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">

    <!-- SEÇÃO 1: EXIBIÇÃO DO PET (Ativada via NFC / URL ?pet=ID) -->
    <div id="view-pet" class="card hidden">
      <div class="pet-header">
        <span style="font-size:0.8rem; letter-spacing:1px; opacity:0.9;">PET PERDIDO / IDENTIFICAÇÃO</span>
      </div>
      <img id="pet-foto" class="pet-avatar" src="" alt="Foto">
      <div class="pet-body">
        <h1 id="pet-nome" class="pet-title">---</h1>
        <p id="pet-raca" class="pet-breed">---</p>

        <div class="info-box">
          <p><strong>Tutor(a):</strong> <span id="pet-dono">---</span></p>
          <p><strong>Vacinas:</strong> <span id="pet-vacinas">---</span></p>
          <p><strong>Observações:</strong> <span id="pet-obs">---</span></p>
        </div>

        <a id="btn-wsp" href="#" class="btn btn-wsp" target="_blank">
          Falar no WhatsApp
        </a>
        <button id="btn-gps" class="btn btn-gps" onclick="enviarLocalizacao()">
          Enviar Minha Localização GPS
        </button>
        <a id="btn-tel" href="#" class="btn btn-tel">
          Ligar para o Tutor
        </a>
      </div>
    </div>

    <!-- SEÇÃO 2: PAINEL DE GERENCIAMENTO E CADASTRO (Ativado sem parâmetros na URL) -->
    <div id="view-admin" class="hidden">
      
      <!-- LISTA DE PETS -->
      <div class="card" style="padding: 20px;">
        <div class="admin-title">
          <span>Pets Cadastrados</span>
        </div>
        <div id="lista-pets"></div>
      </div>

      <!-- FORMULÁRIO DE CADASTRO -->
      <div class="card" style="padding: 20px;">
        <div class="admin-title">Cadastrar Novo Pet</div>
        <form id="form-pet" onsubmit="gerarCodigo(event)">
          <div class="form-group">
            <label>ID / Chave (Apenas letras/números ex: thor):</label>
            <input type="text" id="in-id" required placeholder="ex: thor">
          </div>
          <div class="form-group">
            <label>Nome do Pet:</label>
            <input type="text" id="in-nome" required placeholder="ex: Thor">
          </div>
          <div class="form-group">
            <label>Raça:</label>
            <input type="text" id="in-raca" placeholder="ex: Golden Retriever">
          </div>
          <div class="form-group">
            <label>URL da Foto (Link da imagem):</label>
            <input type="url" id="in-foto" placeholder="https://...">
          </div>
          <div class="form-group">
            <label>Nome do Tutor(a):</label>
            <input type="text" id="in-dono" required placeholder="ex: Dimas">
          </div>
          <div class="form-group">
            <label>Telefone / WhatsApp (Com DDD):</label>
            <input type="text" id="in-telefone" required placeholder="83999999999">
          </div>
          <div class="form-group">
            <label>Vacinas:</label>
            <input type="text" id="in-vacinas" placeholder="ex: V10 em dia, Raiva OK">
          </div>
          <div class="form-group">
            <label>Observações / Cuidados:</label>
            <textarea id="in-obs" rows="2" placeholder="ex: Dócil, alergia a frango"></textarea>
          </div>
          <button type="submit" class="btn btn-wsp" style="margin-top:10px;">Gerar Código para o GitHub</button>
        </form>

        <div id="bloco-codigo" class="hidden">
          <p style="font-size:0.85rem; color:var(--subtext); margin-top:15px;">Copie o bloco abaixo e cole dentro do objeto <code>bancoDeDadosPets</code> no seu código:</p>
          <pre id="codigo-gerado"></pre>
          <button class="btn btn-copy" onclick="copiarCodigo()" style="width:100%; margin-top:5px;">Copiar Código</button>
        </div>
      </div>

    </div>

  </div>

  <script>
    // ========================================================
    // BANCO DE DADOS DOS PETS (CADASTROS EXISTENTES)
    // ========================================================
    const bancoDeDadosPets = {
      "thor": {
        nome: "Thor",
        raca: "Golden Retriever",
        foto: "https://images.unsplash.com/photo-1552053831-71594a27632d?w=400",
        dono: "Dimas",
        telefone: "83999999999",
        vacinas: "V10 em dia, Raiva OK",
        observacoes: "Muito dócil. Tem alergia a frango."
      },
      "luna": {
        nome: "Luna",
        raca: "Poodle",
        foto: "https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=400",
        dono: "Maria",
        telefone: "83988888888",
        vacinas: "Todas atualizadas",
        observacoes: "Assustada com barulhos altos."
      }
    };

    // Variavel global para armazenar o telefone do pet em exibicao
    let telefonePetAtual = "";
    let nomePetAtual = "";

    // CAPTURA PARÂMETROS DA URL
    const params = new URLSearchParams(window.location.search);
    const petId = params.get('pet');

    // ROTEAMENTO DE VISÃO
    if (petId) {
      // EXIBIR CARTÃO DO PET (MODO NFC)
      document.getElementById('view-pet').classList.remove('hidden');
      const pet = bancoDeDadosPets[petId];

      if (pet) {
        nomePetAtual = pet.nome;
        telefonePetAtual = pet.telefone.replace(/\D/g, '');

        document.getElementById('pet-nome').innerText = pet.nome;
        document.getElementById('pet-raca').innerText = pet.raca || 'Sem raça definida';
        document.getElementById('pet-foto').src = pet.foto || 'https://via.placeholder.com/150';
        document.getElementById('pet-dono').innerText = pet.dono;
        document.getElementById('pet-vacinas').innerText = pet.vacinas || 'Não informada';
        document.getElementById('pet-obs').innerText = pet.observacoes || 'Nenhuma';

        document.getElementById('btn-wsp').href = `https://wa.me/55${telefonePetAtual}?text=Olá! Encontrei o pet ${pet.nome}!`;
        document.getElementById('btn-tel').href = `tel:${telefonePetAtual}`;
      } else {
        document.getElementById('view-pet').innerHTML = `<div style="padding:40px; text-align:center; color:#ef4444;"><h2>Pet não localizado</h2><p>Verifique o link lido no NFC.</p></div>`;
      }

    } else {
      // EXIBIR PAINEL DE ADMIN / CADASTRO
      document.getElementById('view-admin').classList.remove('hidden');
      renderizarListaAdmin();
    }

    // FUNÇÃO: ENVIAR LOCALIZAÇÃO GPS VIA WHATSAPP
    function enviarLocalizacao() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const linkMaps = `https://maps.google.com/?q=${lat},${lng}`;
            const msg = `Olá! Encontrei o pet ${nomePetAtual}! Minha localização atual é: ${linkMaps}`;
            
            window.open(`https://wa.me/55${telefonePetAtual}?text=${encodeURIComponent(msg)}`, '_blank');
          },
          (error) => {
            alert("Não foi possível obter a localização. Certifique-se de autorizar a localização no celular.");
          }
        );
      } else {
        alert("Seu navegador não suporta geolocalização.");
      }
    }

    // FUNÇÃO: RENDERIZAR LISTA NO PAINEL ADMIN
    function renderizarListaAdmin() {
      const container = document.getElementById('lista-pets');
      const baseUrl = window.location.origin + window.location.pathname;
      container.innerHTML = '';

      Object.keys(bancoDeDadosPets).forEach(key => {
        const pet = bancoDeDadosPets[key];
        const linkNfc = `${baseUrl}?pet=${key}`;

        const html = `
          <div class="pet-item">
            <img src="${pet.foto || 'https://via.placeholder.com/50'}" alt="${pet.nome}">
            <div class="pet-item-info">
              <strong>${pet.nome} (${key})</strong>
              <span>Tutor: ${pet.dono}</span>
            </div>
            <div>
              <button class="btn btn-copy" onclick="copiarLink('${linkNfc}')">Copiar Link NFC</button>
            </div>
          </div>
        `;
        container.innerHTML += html;
      });
    }

    // FUNÇÃO: COPIAR LINK NFC
    function copiarLink(link) {
      navigator.clipboard.writeText(link);
      alert("Link copiado para a área de transferência!\n\nLink: " + link);
    }

    // FUNÇÃO: GERAR CÓDIGO JS PARA ADICIONAR NO GITHUB
    function gerarCodigo(event) {
      event.preventDefault();

      const id = document.getElementById('in-id').value.trim().toLowerCase().replace(/\s+/g, '-');
      const petObj = {
        nome: document.getElementById('in-nome').value,
        raca: document.getElementById('in-raca').value,
        foto: document.getElementById('in-foto').value,
        dono: document.getElementById('in-dono').value,
        telefone: document.getElementById('in-telefone').value,
        vacinas: document.getElementById('in-vacinas').value,
        observacoes: document.getElementById('in-obs').value
      };

      const codigoFormatado = `"${id}": ${JSON.stringify(petObj, null, 2)},`;

      document.getElementById('codigo-gerado').innerText = codigoFormatado;
      document.getElementById('bloco-codigo').classList.remove('hidden');
    }

    function copiarCodigo() {
      const codigo = document.getElementById('codigo-gerado').innerText;
      navigator.clipboard.writeText(codigo);
      alert("Código copiado! Agora abra o index.html no GitHub e cole dentro de bancoDeDadosPets.");
    }
  </script>
</body>
</html>
