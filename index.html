<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>PET Tag NFC</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#2563eb;--ph:#1d4ed8;--ok:#16a34a;--gps:#ea580c;--bg:#f1f5f9;--t:#0f172a;--s:#64748b;--b:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);padding-top:env(safe-area-inset-top)}
#app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.hd{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;padding:24px 20px 28px;border-radius:0 0 28px 28px;display:flex;justify-content:space-between;align-items:center}
.hd h1{font-size:1.4rem;font-weight:800}.hd p{opacity:.85;font-size:.85rem;margin-top:2px}
.ic{background:#ffffff26;border:0;border-radius:14px;width:46px;height:46px;font-size:1.2rem;cursor:pointer}
main{padding:16px}
.in,textarea{width:100%;padding:14px;border:1px solid var(--b);border-radius:14px;font-size:1rem;background:#fff;outline:0;resize:vertical}
.in:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px #2563eb1a}
.chips{display:flex;gap:8px;margin:12px 0}
.chip{border:1px solid var(--b);background:#fff;border-radius:50px;padding:9px 16px;font-weight:600;font-size:.85rem;color:var(--s);cursor:pointer}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px #0000000a;cursor:pointer}
.row img{width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#dbeafe}
.row div{flex:1;min-width:0}.row b{display:block}
.row small{color:var(--s);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:.72rem;font-weight:700;padding:5px 10px;border-radius:50px;background:#dbeafe;color:var(--ph)}
.tag.crianca{background:#ffedd5;color:#c2410c}
.empty{text-align:center;color:var(--s);padding:40px 10px}
.fab{position:fixed;right:max(20px,calc(50% - 240px));bottom:calc(24px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:2rem;box-shadow:0 10px 22px #2563eb55;cursor:pointer}
#sh{display:none;position:fixed;inset:0;z-index:10}#sh.open{display:block}
.bd{position:absolute;inset:0;background:#0f172a80}
.pn{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:auto;max-height:92vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.pn h2{margin-bottom:14px;font-size:1.2rem}
.b{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:0;border-radius:14px;background:var(--b);color:var(--t);font-weight:700;font-size:.95rem;text-decoration:none;margin-top:8px;cursor:pointer}
.b.p{background:var(--p);color:#fff}.b.ok{background:var(--ok);color:#fff}.b.gps{background:var(--gps);color:#fff}.b.d{background:#fee2e2;color:#dc2626}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.dh{display:flex;align-items:center;gap:14px;margin-bottom:14px}.dh img{width:68px;height:68px;border-radius:50%;object-fit:cover}
.dh b{font-size:1.15rem;display:block}.dh small,.hint{color:var(--s);font-size:.8rem;line-height:1.4}
.lk{background:#f8fafc;border:1px solid var(--b);border-radius:12px;padding:10px 12px;font-size:.8rem;word-break:break-all;margin:6px 0 4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.seg button{padding:12px;border-radius:14px;border:2px solid var(--b);background:#fff;font-weight:700;font-size:.95rem;cursor:pointer}
.seg button.on{border-color:var(--p);background:#eff6ff;color:var(--ph)}
.pf{display:flex;align-items:center;gap:14px;margin-bottom:14px}.pf img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--b)}.pf div{flex:1}
.fg{margin-bottom:14px}.fg label{display:block;font-size:.85rem;font-weight:700;color:var(--s);margin-bottom:6px}
.pc{background:#fff;min-height:100vh}
.hb{height:120px;background:linear-gradient(135deg,#2563eb,#1d4ed8)}.hb.k{background:linear-gradient(135deg,#ea580c,#c2410c)}
.pp{padding:0 22px 32px;text-align:center}
.av{width:140px;height:140px;border-radius:50%;border:5px solid #fff;object-fit:cover;margin:-70px auto 14px;display:block;background:#dbeafe;box-shadow:0 10px 20px #0000001a}
.bg{display:inline-flex;align-items:center;gap:8px;background:#fee2e2;color:#dc2626;border:1px solid #fecaca;padding:7px 15px;border-radius:50px;font-size:.85rem;font-weight:700;margin-bottom:12px}
.bg::before{content:'';width:8px;height:8px;border-radius:50%;background:#dc2626;animation:pl 1.5s infinite}
@keyframes pl{50%{opacity:.35;transform:scale(1.3)}}
.pp h1{font-size:1.9rem;font-weight:800;line-height:1.15}.sb{color:var(--s);margin:6px 0 20px}
.ig{background:#f8fafc;border:1px solid var(--b);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.ir{display:flex;gap:12px}.ir i{font-style:normal;width:38px;height:38px;border-radius:11px;background:#fff;border:1px solid var(--b);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ir small{color:var(--s);font-size:.8rem;font-weight:600;display:block}.ir span{font-weight:600;line-height:1.4}
.ur{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:14px;padding:12px;font-size:.88rem;margin-bottom:12px;text-align:left}
.nf{padding:60px 24px;text-align:center}.nf p{color:var(--s);margin-top:8px}
pre{background:#0f172a;color:#38bdf8;padding:14px;border-radius:14px;font-size:.8rem;overflow-x:auto;white-space:pre-wrap;word-break:break-all;text-align:left;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:14px;font-size:.9rem;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id), K='pettag_v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L={pet:{raca:'Raça / espécie',dono:'Tutor(a)',vacinas:'Vacinas e saúde'},crianca:{raca:'Idade e descrição',dono:'Responsável',vacinas:'Saúde e alergias'}};
const DEMO=()=>[
  {id:'bob',tipo:'pet',emoji:'🐶',nome:'Bob Marley',raca:'Vira-lata caramelo',dono:'Carla Menezes',telefone:'11999990001',vacinas:'V10 e antirrábica em dia',observacoes:'Muito dócil, mas tem medo de fogos. Alergia a salsicha.',foto:''},
  {id:'mel',tipo:'pet',emoji:'🐱',nome:'Mel',raca:'Gata siamesa',dono:'João Pereira',telefone:'21999990002',vacinas:'V4 em dia, castrada',observacoes:'Coleira azul com guizo. Nunca saiu de casa sozinha.',foto:''},
  {id:'lucas',tipo:'crianca',emoji:'👦',nome:'Lucas Almeida',raca:'6 anos, camiseta azul',dono:'Ana Almeida (mãe)',telefone:'85999990003',vacinas:'Alergia a amendoim e asma leve',observacoes:'Pode ficar assustado e falar pouco. Converse com calma e fique com ele até a família chegar.',foto:''}
];

let S={list:[],base:''}, cur, cid, ph='', tp='pet', filt='all', qs='';

try{S=JSON.parse(localStorage.getItem(K))||S}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Sem espaço para salvar. Use fotos menores.')}};

let tt;
const toast=m=>{const t=$('toast');t.textContent=m;t.className='on';clearTimeout(tt);tt=setTimeout(()=>t.className='',3200)};
const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const tel=s=>{const d=String(s||'').replace(/\D/g,'');return d.startsWith('55')&&d.length>11?d.slice(2):d};
const av=r=>r.foto||'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#dbeafe"/><text x="50" y="68" font-size="54" text-anchor="middle">${r.emoji||(r.tipo=='crianca'?'🧒':'🐾')}</text></svg>`);
const base=()=>{let b=S.base||location.href.split(/[?#]/)[0];return /\/$\vert{}\.html?$/.test(b)?b:b+'/'};
const link=r=>base()+'?pet='+r.id;
const enc=r=>btoa(unescape(encodeURIComponent(JSON.stringify([r.tipo=='crianca'?'c':'p',r.nome,r.raca,r.dono,tel(r.telefone),r.vacinas,r.observacoes])))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=s=>{const a=JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));return{tipo:a[0]=='c'?'crianca':'pet',nome:a[1],raca:a[2],dono:a[3],telefone:a[4],vacinas:a[5],observacoes:a[6]}};
const auto=r=>base()+'#d='+enc(r);
const url=(r,m)=>m?auto(r):link(r);
const dl=(n,t)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=n;a.click()};
const pure=r=>({tipo:r.tipo,nome:r.nome,raca:r.raca,foto:r.foto||'',dono:r.dono,telefone:r.telefone,vacinas:r.vacinas,observacoes:r.observacoes});

function msg(r,loc){
  const c=r.tipo=='crianca';
  return `Olá, ${r.dono}! 👋\n\n`+(c?`⚠️ Encontrei *${r.nome}* e está comigo, em segurança. Fique tranquilo(a), vou ficar junto até vocês chegarem.`:`🐾 Encontrei *${r.nome}* e está comigo, em segurança.`)+(loc?`\n\n📍 Estamos aqui: ${loc}`:'')+`\n\nPode me responder por aqui para combinarmos o encontro?`;
}
const wa=(r,loc)=>`https://wa.me/55${tel(r.telefone)}?text=${encodeURIComponent(msg(r,loc))}`;

function admin(){
  if(!S.seeded){S.list=DEMO();S.seeded=1;save()}
  $('app').style.padding='';$('app').innerHTML=`<header class="hd"><div><h1>PET Tag NFC</h1><p>${S.list.length} cadastro(s)</p></div><button class="ic" onclick="cfg()" aria-label="Configurações">⚙️</button></header>
  <main><input id="bq" class="in" placeholder="🔍 Buscar por nome ou responsável" oninput="qs=this.value;lst()">
  <div class="chips">${[['all','Todos'],['pet','Pets'],['crianca','Crianças']].map(([k,t])=>`<button class="chip ${filt==k?'on':''}" onclick="filt='${k}';admin()">${t}</button>`).join('')}</div><div id="lst"></div></main>
  <button class="fab" onclick="form()" aria-label="Novo cadastro">＋</button>`;
  $('bq').value=qs;lst();
}

function lst(){
  const t=qs.toLowerCase();
  const a=S.list.filter(r=>(filt=='all'||r.tipo==filt)&&(r.nome+' '+r.dono).toLowerCase().includes(t));
  $('lst').innerHTML=a.length?a.map(r=>`<div class="row" onclick="det('${r.id}')"><img src="${av(r)}" alt=""><div><b>${esc(r.nome)}</b><small>${esc(r.raca)}</small><small>${esc(r.dono)}</small></div><span class="tag ${r.tipo}">${r.tipo=='crianca'?'Criança':'Pet'}</span></div>`).join(''):'<p class="empty">Nenhum cadastro por aqui. Toque em ＋ para criar o primeiro.</p>';
}

function sheet(h){
  let s=$('sh');
  if(!s){s=document.createElement('div');s.id='sh';document.body.appendChild(s)}
  s.innerHTML=`<div class="bd" onclick="closeSh()"></div><div class="pn">${h}</div>`;
  s.className='open';
}
const closeSh=()=>{const s=$('sh');if(s)s.className=''};

function det(id){
  const r=S.list.find(x=>x.id==id), A=auto(r);
  sheet(`<div class="dh"><img src="${av(r)}" alt=""><div><b>${esc(r.nome)}</b><small>${esc(r.dono)}</small></div></div>
  <div class="hint">Link público curto</div><div class="lk">${esc(link(r))}</div>
  <button class="b p" onclick="nfc('${id}',0)">📲 Gravar link curto na tag NFC</button>
  <button class="b" onclick="nfc('${id}',1)">📲 Gravar link autônomo (${A.length} caracteres)</button>
  <p class="hint" style="margin-top:8px">O link curto carrega a foto, mas exige o arquivo JSON publicado no GitHub. O autônomo funciona sem GitHub e sem foto; cabe em tags NTAG215 ou NTAG216.</p>
  <div class="g2"><button class="b" onclick="cp('${id}',0)">🔗 Copiar curto</button><button class="b" onclick="cp('${id}',1)">🧩 Copiar autônomo</button>
  <a class="b" href="?pet=${id}" target="_blank">👁 Ver página</a><button class="b" onclick="dl('${id}.json',JSON.stringify(pure(S.list.find(x=>x.id=='${id}')),null,2));toast('Salve o arquivo na pasta pets/ do GitHub')">📄 JSON do GitHub</button>
  <button class="b" onclick="form('${id}')">✏️ Editar</button><button class="b d" onclick="del('${id}')">🗑 Excluir</button></div>`);
}

async function cp(id,m){
  const u=url(S.list.find(x=>x.id==id),m);
  try{await navigator.clipboard.writeText(u);toast('Link copiado')}catch(e){prompt('Copie o link:',u)}
}

async function nfc(id,m){
  const u=url(S.list.find(x=>x.id==id),m);
  if(!('NDEFReader' in window))return toast('NFC indisponível. Abra no Chrome do Android, pelo endereço HTTPS do site.');
  try{
    toast('Aproxime a tag NFC do celular...');
    await new NDEFReader().write({records:[{recordType:'url',data:u}]});
    toast('✅ Tag gravada com sucesso');
  }catch(e){
    toast(e.name=='NotAllowedError'?'Permissão de NFC negada':'Não foi possível gravar. Se a tag for pequena (NTAG213), use o link curto.');
  }
}

function del(id){
  const r=S.list.find(x=>x.id==id);
  if(!confirm(`Excluir ${r.nome}? O link e a tag NFC deixam de funcionar.`))return;
  S.list=S.list.filter(x=>x.id!=id);
  save();closeSh();admin();toast('Cadastro excluído');
}

function form(id){
  const r=id?{...S.list.find(x=>x.id==id)}:{tipo:'pet'};
  ph=r.foto||'';
  fm(r,id);
}

function fm(r,id){
  cid=id;tp=r.tipo||'pet';const l=L[tp];
  const f=(k,t,p)=>`<div class="fg"><label>${t}</label>${k=='observacoes'?`<textarea id="i-${k}" rows="3" placeholder="${p}">${esc(r[k])}</textarea>`:`<input id="i-${k}" class="in" ${k=='telefone'?'inputmode="tel"':''} value="${esc(r[k])}" placeholder="${p}" ${k=='nome'?'oninput="updFile(this.value)"':''}>`}</div>`;
  sheet(`<h2>${id?'Editar cadastro':'Novo cadastro'}</h2>
  <div class="seg"><button class="${tp=='pet'?'on':''}" onclick="setTp('pet')">🐾 Pet</button><button class="${tp=='crianca'?'on':''}" onclick="setTp('crianca')">🧒 Criança</button></div>
  <div class="pf"><img id="pv" src="${av({...r,foto:ph})}" alt=""><div><button class="b" style="margin:0 0 8px" onclick="$('f1').click()">🖼 Escolher da galeria</button><button class="b" style="margin:0" onclick="$('f2').click()">📷 Tirar foto</button></div></div>
  <input type="file" id="f1" accept="image/*" hidden onchange="img(this)"><input type="file" id="f2" accept="image/*" capture="environment" hidden onchange="img(this)">
  ${f('nome','Nome','ex: Bob Marley')}${f('raca',l.raca,tp=='pet'?'ex: Vira-lata caramelo':'ex: 6 anos, camiseta azul')}${f('dono',l.dono,'ex: Carla Menezes')}${f('telefone','WhatsApp com DDD','11999990001')}${f('vacinas',l.vacinas,tp=='pet'?'ex: V10 em dia':'ex: alergia a amendoim')}${f('observacoes','Observações importantes','ex: Muito dócil, tem medo de fogos')}
  <div class="hint" style="margin-bottom:4px">Crie um arquivo na pasta <code>pets/</code> com este nome no GitHub:</div>
  <div id="file-name-preview" class="lk">pets/${cid || slug(r.nome||'nome-do-pet')}.json</div>
  <button class="b ok" onclick="sv()">Salvar cadastro</button><button class="b" onclick="closeSh()">Cancelar</button>
  <div id="json-block" style="display:none;margin-top:12px">
    <div class="hint">Copie o JSON abaixo para criar o arquivo:</div>
    <pre id="json-preview"></pre>
    <button class="b p" onclick="copyJson()">📋 Copiar código JSON</button>
  </div>`);
}

function updFile(v){
  const s=cid || slug(v||'nome-do-pet');
  if($('file-name-preview'))$('file-name-preview').innerText = `pets/${s}.json`;
}

function rd(){
  const o={};
  ['nome','raca','dono','telefone','vacinas','observacoes'].forEach(k=>o[k]=$('i-'+k).value.trim());
  o.foto=ph;o.tipo=tp;
  return o;
}

function setTp(t){const o=rd();o.tipo=t;fm(o,cid)}

function img(inp){
  const f=inp.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=e=>{
    const i=new Image();
    i.onload=()=>{
      const k=Math.min(1,420/Math.max(i.width,i.height)),c=document.createElement('canvas');
      c.width=i.width*k;c.height=i.height*k;
      c.getContext('2d').drawImage(i,0,0,c.width,c.height);
      ph=c.toDataURL('image/jpeg',.75);
      $('pv').src=ph;
    };
    i.src=e.target.result;
  };
  fr.readAsDataURL(f);
}

function sv(){
  const o=rd();
  if(!o.nome||!o.dono||tel(o.telefone).length<10)return toast('Preencha nome, responsável e WhatsApp com DDD');
  o.telefone=tel(o.telefone);
  if(cid){
    const i=S.list.findIndex(x=>x.id==cid);
    o.id=cid;
    if(S.list[i].emoji)o.emoji=S.list[i].emoji;
    S.list[i]=o;
  } else {
    const b=slug(o.nome)||'cadastro';
    let id=b,n=2;
    while(S.list.some(x=>x.id==id))id=b+'-'+n++;
    o.id=id;
    S.list.unshift(o);
  }
  save();
  
  $('json-preview').innerText = JSON.stringify(pure(o), null, 2);$('json-block').style.display = 'block';
  toast('Cadastro salvo! Crie o arquivo na pasta pets/ do GitHub.');
}

function copyJson(){
  const code = $('json-preview').innerText;
  navigator.clipboard.writeText(code);
  toast('JSON copiado!');
}

function cfg(){
  sheet(`<h2>Configurações</h2>
  <div class="fg"><label>Endereço do seu site (GitHub Pages)</label><input id="cb" class="in" value="${esc(S.base)}" placeholder="https://seuusuario.github.io/pet-tag/"><p class="hint" style="margin-top:6px">Os links e as tags usam este endereço. Para gravar NFC, abra o painel por ele, em HTTPS, no Chrome do Android.</p></div>
  <button class="b p" onclick="S.base=$('cb').value.trim();save();closeSh();toast('Endereço salvo')">Salvar endereço</button>
  <button class="b" onclick="dl('pet-tag-backup.json',JSON.stringify(S.list))">💾 Exportar backup</button>
  <button class="b" onclick="$('imp').click()">📂 Importar backup</button><input type="file" id="imp" accept=".json" hidden onchange="imp(this)">
  <button class="b" onclick="DEMO().forEach(d=>{if(!S.list.some(x=>x.id==d.id))S.list.push(d)});save();closeSh();admin();toast('Exemplos restaurados')">🐾 Restaurar exemplos fictícios</button>
  <p class="hint" style="margin-top:10px">Os cadastros ficam salvos neste aparelho. Faça backup antes de trocar de celular ou limpar o navegador.</p>`);
}

function imp(i){
  const f=i.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const a=JSON.parse(e.target.result);
      if(!Array.isArray(a))throw 0;
      S.list=a;save();closeSh();admin();toast('Backup importado');
    }catch(x){toast('Arquivo de backup inválido')}
  };
  r.readAsText(f);
}

function card(p){
  p.tipo=p.tipo||'pet';
  cur=p;
  const c=p.tipo=='crianca', l=L[p.tipo];
  document.title=p.nome+' foi encontrado(a)';
  const row=(i,t,v)=>`<div class="ir"><i>${i}</i><div><small>${t}</small><span>${esc(v)}</span></div></div>`;
  $('app').style.padding='0';$('app').innerHTML=`<div class="pc"><div class="hb ${c?'k':''}"></div><div class="pp"><img class="av" src="${av(p)}" alt="Foto de ${esc(p.nome)}">
  <span class="bg">${c?'Criança encontrada':'Pet encontrado'}</span><h1>${esc(p.nome)}</h1><p class="sb">${esc(p.raca||'')}</p>
  <div class="ig">${row('👤',l.dono,p.dono)}${row('🩺',l.vacinas,p.vacinas||'Não informado')}${row('📝','Observações',p.observacoes||'Nenhuma')}</div>
  ${c?'<p class="ur">Fique com a criança em um lugar seguro e movimentado. Em caso de risco ou emergência, ligue 190.</p>':''}
  <a class="b ok" href="${wa(p)}" target="_blank">💬 Avisar no WhatsApp</a>
  <button id="gt" class="b gps" onclick="gps()">📍 Enviar minha localização</button>
  <a class="b p" href="tel:${tel(p.telefone)}">📞 Ligar para ${esc(l.dono.split(' ')[0].replace(/\(.*/,''))}</a></div></div>`;
}

function gps(){
  const b=$('gt'), r=()=>b.textContent='📍 Enviar minha localização';
  if(!navigator.geolocation)return toast('Seu navegador não tem GPS');
  b.textContent='Obtendo localização...';
  navigator.geolocation.getCurrentPosition(s=>{
    r();
    location.href=wa(cur,`https://maps.google.com/?q=${s.coords.latitude},${s.coords.longitude}`);
  },e=>{
    r();
    toast(e.code==1?'Permita o acesso à localização nas configurações do navegador':'Não foi possível obter o GPS. Confira se ele está ligado.');
  },{enableHighAccuracy:true,timeout:10000,maximumAge:0});
}

function pub(){
  const id=(q.get('pet')||'').toLowerCase(), d=H.get('d');
  let p=null;
  if(d){try{p=dec(d)}catch(e){}}else p=S.list.find(x=>x.id==id);
  if(p)return card(p);
  if(d)return nf();
  fetch('pets/'+encodeURIComponent(id)+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(card).catch(nf);
}

const nf=()=>$('app').innerHTML='<div class="nf"><h1>Cadastro não encontrado</h1><p>Este link ou tag NFC não está mais ativo. Se encontrou um pet ou uma criança, procure ajuda pelo 190.</p></div>';

const q=new URLSearchParams(location.search), H=new URLSearchParams(location.hash.slice(1));
(q.get('pet')||H.get('d'))?pub():admin();
</script>
</body>
