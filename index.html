<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identificação do Pet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f4f6f8; display: flex; justify-content: center; padding: 20px 15px; }
    .card { background: #fff; width: 100%; max-width: 400px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); overflow: hidden; text-align: center; }
    .header { background: #2563eb; color: #fff; padding: 25px 20px; }
    .avatar { width: 110px; height: 110px; border-radius: 50%; border: 4px solid #fff; margin-top: -55px; object-fit: cover; background: #eee; }
    .content { padding: 20px; }
    h1 { font-size: 1.6rem; color: #1e293b; margin-top: 10px; }
    p.raca { color: #64748b; font-size: 0.95rem; margin-bottom: 15px; }
    .info-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; text-align: left; margin-bottom: 15px; font-size: 0.9rem; color: #334155; }
    .info-box strong { color: #0f172a; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 12px; font-weight: 600; text-decoration: none; font-size: 1rem; color: #fff; transition: opacity 0.2s; }
    .btn-wsp { background: #22c55e; }
    .btn-tel { background: #0284c7; }
    .btn:active { opacity: 0.8; }
    .erro { padding: 40px 20px; color: #ef4444; }
  </style>
</head>
<body>

  <div class="card" id="app">
    <!-- O conteúdo será injetado pelo JavaScript -->
    <div style="padding: 40px;">Carregando informações...</div>
  </div>

  <script>
    // 1. BANCO DE DADOS DOS PETS (Edite ou adicione novos aqui)
    const bancoDeDadosPets = {
      "thor": {
        nome: "Thor",
        raca: "Golden Retriever",
        foto: "https://images.unsplash.com/photo-1552053831-71594a27632d?w=400",
        dono: "Dimas",
        telefone: "83999999999",
        vacinas: "V10 em dia, Raiva OK",
        observacoes: "Muito dócil. Tem alergia a frango."
      },
      "luna": {
        nome: "Luna",
        raca: "Poodle",
        foto: "https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=400",
        dono: "Maria",
        telefone: "83988888888",
        vacinas: "Todas atualizadas",
        observacoes: "Assustada com barulhos altos."
      }
    };

    // 2. CAPTURA O PARÂMETRO DA URL (?pet=thor)
    const params = new URLSearchParams(window.location.search);
    const petId = params.get('pet');
    const container = document.getElementById('app');

    // 3. EXIBE AS INFORMAÇÕES
    if (petId && bancoDeDadosPets[petId]) {
      const pet = bancoDeDadosPets[petId];
      const telFormatado = pet.telefone.replace(/\D/g, '');

      container.innerHTML = `
        <div class="header">
          <p style="font-size:0.85rem; opacity:0.9;">PET PERDIDO / IDENTIFICAÇÃO</p>
        </div>
        <img class="avatar" src="${pet.foto}" alt="Foto do pet">
        <div class="content">
          <h1>${pet.nome}</h1>
          <p class="raca">${pet.raca}</p>

          <div class="info-box">
            <p><strong>Tutor(a):</strong> ${pet.dono}</p>
            <p style="margin-top:5px;"><strong>Vacinas:</strong> ${pet.vacinas}</p>
            <p style="margin-top:5px;"><strong>Observações:</strong> ${pet.observacoes}</p>
          </div>

          <a href="https://wa.me/55${telFormatado}?text=Olá! Encontrei o pet ${pet.nome}!" class="btn btn-wsp" target="_blank">
            Falar no WhatsApp
          </a>
          <a href="tel:${telFormatado}" class="btn btn-tel">
            Ligar para o Tutor
          </a>
        </div>
      `;
    } else {
      container.innerHTML = `
        <div class="erro">
          <h2>Pet não localizado</h2>
          <p style="margin-top:10px; color:#64748b;">Verifique o link ou o código lido no NFC.</p>
        </div>
      `;
    }
  </script>
</body>
</html>
